[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "judge"
version = "0.1.0"
description = "Crash-safe code execution and verification engine"
requires-python = ">=3.12"
dependencies = ["asyncpg>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools]
# Listed by hand, because the repo also holds non-Python folders
packages = ["core", "db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
