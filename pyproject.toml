[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "judge"
version = "0.1.0"
description = "Crash-safe code execution and verification engine"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools]
# Listed by hand, because the repo also holds non-Python folders
packages = ["admin", "api", "core", "db", "worker"]

[tool.setuptools.package-data]
api = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The chaos test takes minutes, so it only runs when asked for with -m chaos
addopts = "-m 'not chaos'"
markers = [
    "sandbox: needs Docker, gVisor and the judge images",
    "chaos: long crash test, run on purpose with -m chaos",
]
