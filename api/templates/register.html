{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block main %}
<h1>Register</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form class="stack" method="post" action="/register">
  <label>Email <input name="email" type="email" value="{{ email or '' }}" autocomplete="email" required></label>
  <label>Password <input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
  <label>Invite code <input name="invite_code" autocomplete="off" required></label>
  <button>Register</button>
</form>
{% endblock %}
